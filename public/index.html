<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OPEN RADAR</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f6f8;color:#202a32;font:16px/1.65 system-ui,-apple-system,"Segoe UI",sans-serif}header{background:#142b35;color:white;padding:24px max(16px,calc((100% - 1160px)/2))}h1{margin:0;font-size:28px;letter-spacing:.06em}header p{margin:4px 0;color:#cedde2;font-size:14px}main{max-width:1200px;margin:auto;padding:20px}h2{font-size:23px;margin:0 0 14px}h3{font-size:18px;margin:8px 0}p{overflow-wrap:anywhere}.panel,.dataset{background:white;padding:20px;border:1px solid #dce3e7;border-radius:12px;margin-bottom:16px}.dataset p{margin:8px 0}.tools{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:18px 0}.tools label{min-width:0;font-size:13px;font-weight:600}input,select{display:block;width:100%;min-width:0;min-height:44px;padding:10px;border:1px solid #aebbc3;border-radius:7px;font:16px system-ui;background:white;color:#202a32}button,.official{display:inline-flex;align-items:center;justify-content:center;min-height:44px;max-width:100%;padding:10px 16px;background:#1b5966;color:white;border:0;border-radius:7px;font:14px/1.5 system-ui;text-decoration:none;cursor:pointer;overflow-wrap:anywhere}button:disabled{background:#e3e8eb;color:#69777d;cursor:default}button:focus-visible,a:focus-visible,summary:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #c56800;outline-offset:3px}.badge{display:inline-block;border-radius:5px;padding:3px 8px;background:#eaf2f4;font-size:12px;margin:0 6px 4px 0}.small,#rowCount{font-size:13px;color:#51636c}.notice{background:#eef4f6;border-left:3px solid #548492;padding:12px;font-size:13px}.error{background:#fff0f0;color:#8b2424;padding:16px}.table-wrap{max-height:68vh;overflow:auto;border:1px solid #dce3e7;border-radius:8px;margin:12px 0}table{border-collapse:collapse;width:100%;background:white}th,td{border-bottom:1px solid #dce3e7;padding:10px;font-size:13px;text-align:left;white-space:nowrap}th{position:sticky;top:0;background:#eaf0f3;z-index:1}th button{background:transparent;color:#193d48;padding:4px 8px}tr:hover{background:#f5fafb}.record-cards{display:none}#pagination{display:flex;align-items:center;justify-content:center;gap:12px;margin:18px 0}#pagination span{font-size:13px}#backButton{margin-bottom:18px}.sr-only{position:absolute;width:1px;height:1px;padding:0;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap}[hidden]{display:none!important}details .close-label{display:none}details[open] .close-label{display:inline}details[open] .open-label{display:none}summary{min-height:44px;padding:10px 0;cursor:pointer;font-weight:600}dl{margin:0}dt{font-size:12px;color:#51636c;margin-top:10px}dd{margin:2px 0 10px;font-size:14px;white-space:pre-wrap;overflow-wrap:anywhere}.record-card{min-width:0;padding:16px;border:1px solid #dce3e7;border-radius:9px;overflow-wrap:anywhere}.record-card .official{width:100%;margin:10px 0}footer{font-size:13px;color:#51636c;margin:20px 0}#results{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.dataset{margin:0;min-width:0}.dataset button{margin-top:8px}@media(max-width:700px){main{padding:12px}.panel,.dataset{padding:14px}header{padding:20px 16px}.tools{grid-template-columns:1fr;gap:10px}#results{grid-template-columns:1fr}.table-wrap{display:none}.record-cards{display:grid;gap:12px;margin-top:12px}h2{font-size:21px}button,.official{width:100%}#pagination button{width:auto;flex:1}#pagination{gap:8px}#pagination span{white-space:nowrap}select,input{max-width:100%}}
.official{position:relative}
</style></head><body><header><h1>OPEN RADAR</h1><p>地域から、施設と事業の動きを探す</p></header><main><section id="listPage"><div class="panel"><h2>公開データを探す</h2><div class="tools"><label>地域<select id="prefecture"></select></label><label>分野<select id="category"></select></label><label>細分類<select id="subcategory"></select></label><label>キーワード<input id="keyword" type="search" placeholder="分野・名称など"></label></div><p id="count" role="status">読み込み中…</p></div><div id="results"></div></section><section id="detailPage" hidden><div class="panel"><button id="backButton">← 一覧に戻る</button><div id="detail"></div></div></section><footer>公式公開情報を検索しやすく整理しています。最新・正式な内容は公開元をご確認ください。</footer></main><script>"use strict";
const $=id=>document.getElementById(id);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=v=>String(v??'').normalize('NFKC').toLowerCase().trim();
let datasets=[],active=null,rows=[],filtered=[],page=1,sort={column:'',asc:true},requestId=0;
const cache=new Map();
const PAGE_SIZE=25;
let verifiedURLs=new Set();
function safeOfficialURL(value){
 if(typeof value!=='string'||/[\s\\\u0000-\u001f\u007f]/.test(value)||!verifiedURLs.has(value))return '';
 try{const u=new URL(value);return u.protocol==='https:'&&!u.username&&!u.password&&!u.port&&['www.pref.shiga.lg.jp','www.city.otsu.lg.jp'].includes(u.hostname)?u.href:'';}catch{return '';}
}
function officialLink(url){const u=safeOfficialURL(url);return u?`<a class="official" href="${esc(u)}" target="_blank" rel="noopener noreferrer">公式情報を見る<span class="sr-only">（新しいタブ）</span></a>`:'';}
function options(id,values,caption,keep=true){const el=$(id),prev=keep?el.value:'';el.innerHTML=`<option value="">${esc(caption)}</option>`;[...new Set(values.filter(Boolean))].sort((a,b)=>a.localeCompare(b,'ja',{numeric:true})).forEach(v=>el.add(new Option(v,v)));if([...el.options].some(o=>o.value===prev))el.value=prev;}
function datasetFilters(){
 const regional=datasets.filter(d=>!$('prefecture').value||d.prefecture===$('prefecture').value);
 options('category',regional.map(d=>d.category),'すべての分野');
 options('subcategory',regional.filter(d=>!$('category').value||d.category===$('category').value).map(d=>d.subcategory),'すべての細分類');
 searchData();
}
function searchData(){
 const q=norm($('keyword').value),area=$('prefecture').value,field=$('category').value,sub=$('subcategory').value;
 const found=datasets.filter(d=>(!area||d.prefecture===area)&&(!field||d.category===field)&&(!sub||d.subcategory===sub)&&(!q||norm([d.title,d.description,d.city,d.publisher,...(d.search_terms||[])].join(' ')).includes(q)));
 $('count').textContent=`${found.length}件のデータセット`;
 $('results').innerHTML=found.map(d=>`<article class="dataset"><div><span class="badge">${esc(d.category)}</span><span class="badge">${esc(d.subcategory)}</span></div><h3>${esc(d.title)}</h3><p class="small">${esc(d.city)} · ${d.viewer.type==='csv_table'?'施設・案件を検索':'公式資料を検索'}</p><p>${esc(d.description)}</p><button data-id="${esc(d.id)}">一覧を見る</button></article>`).join('')||'<p>該当するデータがありません。</p>';
 $('results').querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>showDetail(datasets.find(d=>d.id===b.dataset.id)));
}
function parseCSV(text){
 const out=[];let row=[],field='',quoted=false;
 for(let i=0;i<text.length;i++){const c=text[i];if(quoted){if(c==='"'&&text[i+1]==='"'){field+='"';i++;}else if(c==='"')quoted=false;else field+=c;}else if(c==='"')quoted=true;else if(c===','){row.push(field);field='';}else if(c==='\n'){row.push(field);out.push(row);row=[];field='';}else if(c!=='\r')field+=c;}
 if(field||row.length){row.push(field);out.push(row);}if(out[0]?.length)out[0][0]=out[0][0].replace(/^\uFEFF/,'');return out;
}
function region(row){const v=String(row[active.viewer.region_column]||'');const m=v.match(/(大津市|彦根市|長浜市|近江八幡市|草津市|守山市|栗東市|甲賀市|野洲市|湖南市|高島市|東近江市|米原市|日野町|竜王町|愛荘町|豊郷町|甲良町|多賀町)/);return m?m[0]:active.viewer.type==='csv_table'?'地域未確認':active.city;}
function columns(){return active.viewer.display_columns;}
function rowValue(r,c){return c==='地域'?region(r):r[c]||'';}
function dateKey(v){let s=String(v).normalize('NFKC');const era=s.match(/^(令和|平成|昭和|R|H|S)(元|\d+)[年/.\-](\d+)[月/.\-](\d+)/i);if(era){const offsets={令和:2018,平成:1988,昭和:1925,R:2018,H:1988,S:1925};return (offsets[era[1].toUpperCase()]||offsets[era[1]])+(era[2]==='元'?1:+era[2])+String(+era[3]).padStart(2,'0')+String(+era[4]).padStart(2,'0');}const m=s.match(/^(\d{4})[年/.\-](\d+)[月/.\-](\d+)/);return m?m[1]+String(+m[2]).padStart(2,'0')+String(+m[3]).padStart(2,'0'):s;}
async function showDetail(d){
 const token=++requestId;active=d;rows=[];filtered=[];page=1;sort={column:'',asc:true};
 $('listPage').hidden=true;$('detailPage').hidden=false;
 $('detail').innerHTML=`<h2 tabindex="-1">${esc(d.title)}</h2><p class="small">出典：${esc(d.publisher)}<br>基準日：${esc(d.data_as_of||'未確認')}<br>最終確認日：${esc(d.last_checked||'未確認')}（出典ページの確認）</p>${officialLink(d.source_url)}${(d.additional_sources||[]).map(s=>`<p class="small">${esc(s.label)}<br>${officialLink(s.url)}</p>`).join('')}<p class="notice">${esc(d.notice)}</p><div id="csvArea" aria-busy="true">読み込み中…</div>`;
 window.scrollTo(0,0);$('detail').querySelector('h2').focus();
 try{
 if(d.viewer.type==='csv_table'){
  const path=d.viewer.path,allowed=d.viewer.allowed_columns;
  if(!/^\.\/[a-z0-9_]+\.csv$/.test(path)||!Array.isArray(allowed))throw Error('schema');
  if(cache.has(d.id))rows=cache.get(d.id);else{const res=await fetch(path,{cache:'no-store'});if(!res.ok)throw Error('load');const matrix=parseCSV(await res.text());if(token!==requestId)return;
   if(JSON.stringify(matrix[0])!==JSON.stringify(allowed))throw Error('columns');
   rows=matrix.slice(1).filter(r=>r.some(Boolean)).map(r=>Object.fromEntries(allowed.map((c,i)=>[c,r[i]||''])));cache.set(d.id,rows);
  }
 }else rows=d.viewer.records;
 if(token!==requestId)return;
 $('csvArea').innerHTML=`<div class="tools"><label>地域<select id="rowRegion"></select></label><label>分野<select id="rowField"><option>${esc(d.category)}</option></select></label><label>細分類<select id="rowIndustry"></select></label><label>キーワード<input id="rowSearch" type="search" placeholder="名称・地域など"></label><label>並べ替え<select id="rowSort"></select></label><button id="sortDirection" aria-label="並べ替え方向">昇順</button></div><div id="rowCount" role="status"></div><div id="tableArea"></div><nav id="pagination" aria-label="ページ送り"></nav>`;
 $('csvArea').setAttribute('aria-busy','false');
 options('rowRegion',rows.map(region),'すべての地域',false);options('rowIndustry',rows.map(r=>r[d.viewer.industry_column]),'すべての細分類',false);
 options('rowSort',columns().filter(c=>c!==d.viewer.url_column),'元の順序',false);
 ['rowSearch','rowRegion','rowIndustry'].forEach(id=>$(id).addEventListener(id==='rowSearch'?'input':'change',()=>filterRows(true)));
 $('rowField').onchange=()=>filterRows(true);
 $('rowSort').onchange=()=>{sort.column=$('rowSort').value;filterRows(true);};
 $('sortDirection').onclick=()=>{sort.asc=!sort.asc;$('sortDirection').textContent=sort.asc?'昇順':'降順';filterRows(true);};
 filterRows(true);
 }catch{if(token===requestId)$('csvArea').innerHTML='<p class="error">一覧を読み込めませんでした。一覧へ戻って再度お試しください。</p>';}
}
function filterRows(reset){
 const q=norm($('rowSearch').value),area=$('rowRegion').value,sub=$('rowIndustry').value,v=active.viewer;
 filtered=rows.filter(r=>(!area||region(r)===area)&&(!sub||r[v.industry_column]===sub)&&(!q||norm(v.search_columns.map(c=>r[c]||'').join(' ')).includes(q)));
 if(sort.column){const c=sort.column,isDate=/日|年月/.test(c);filtered.sort((a,b)=>{let x=rowValue(a,c),y=rowValue(b,c);if(isDate){x=dateKey(x);y=dateKey(y);}return String(x).localeCompare(String(y),'ja',{numeric:true})*(sort.asc?1:-1);});}
 if(reset)page=1;renderRows();
}
function fields(row,cols){return cols.map(c=>`<dt>${esc(c)}</dt><dd>${esc(rowValue(row,c)||'—')}</dd>`).join('');}
function cell(row,c){return c===active.viewer.url_column?officialLink(row[c])||'—':esc(rowValue(row,c)||'—');}
function renderRows(){
 const v=active.viewer,cols=columns(),total=filtered.length,pages=Math.max(1,Math.ceil(total/PAGE_SIZE));page=Math.min(page,pages);
 const visible=filtered.slice((page-1)*PAGE_SIZE,page*PAGE_SIZE),primary=v.primary_columns;
 $('rowCount').textContent=`${total}件${total?` · ${(page-1)*PAGE_SIZE+1}–${Math.min(page*PAGE_SIZE,total)}件を表示`:''} / 全${rows.length}件${v.type==='csv_table'?'':'（資料単位）'}`;
 if(!total)$('tableArea').innerHTML='<p class="empty">該当する情報がありません。</p>';
 else{
 let html='<div class="table-wrap"><table><thead><tr>'+cols.map(c=>`<th scope="col" aria-sort="${sort.column===c?(sort.asc?'ascending':'descending'):'none'}"><button data-sort="${esc(c)}">${esc(c)}${sort.column===c?(sort.asc?' ▲':' ▼'):''}</button></th>`).join('')+'</tr></thead><tbody>';
 html+=visible.map(r=>'<tr>'+cols.map(c=>`<td>${cell(r,c)}</td>`).join('')+'</tr>').join('')+'</tbody></table></div>';
 html+='<div class="record-cards">'+visible.map(r=>`<article class="record-card"><h3>${esc(rowValue(r,primary[0])||'名称未確認')}</h3><dl>${fields(r,primary.slice(1))}</dl>${v.url_column?officialLink(r[v.url_column]):''}<details><summary><span class="open-label">詳細を開く</span><span class="close-label">詳細を閉じる</span></summary><dl>${fields(r,cols.filter(c=>!primary.includes(c)&&c!==v.url_column))}</dl></details></article>`).join('')+'</div>';
 $('tableArea').innerHTML=html;
 $('tableArea').querySelectorAll('[data-sort]').forEach(b=>b.onclick=()=>{sort.asc=sort.column===b.dataset.sort?!sort.asc:true;sort.column=b.dataset.sort;$('rowSort').value=sort.column;$('sortDirection').textContent=sort.asc?'昇順':'降順';filterRows(true);});
 }
 $('pagination').innerHTML=`<button id="prevPage" ${page===1?'disabled':''}>前へ</button><span>${page} / ${pages}ページ</span><button id="nextPage" ${page===pages?'disabled':''}>次へ</button>`;
 $('prevPage').onclick=()=>{page--;renderRows();$('rowCount').scrollIntoView({block:'start'});};$('nextPage').onclick=()=>{page++;renderRows();$('rowCount').scrollIntoView({block:'start'});};
}
function showList(){++requestId;active=null;rows=[];filtered=[];$('detailPage').hidden=true;$('detail').replaceChildren();$('listPage').hidden=false;window.scrollTo(0,0);}
async function loadData(){try{const res=await fetch('./data.json',{cache:'no-store'});if(!res.ok)throw Error('load');const data=await res.json();datasets=data.datasets;verifiedURLs=new Set(data.verified_official_urls||[]);options('prefecture',datasets.map(d=>d.prefecture),'すべての地域',false);datasetFilters();}catch{$('count').textContent='データを読み込めませんでした。';}}
['prefecture','category'].forEach(id=>$(id).onchange=datasetFilters);$('subcategory').onchange=searchData;$('keyword').oninput=searchData;$('backButton').onclick=showList;loadData();
</script></body></html>
