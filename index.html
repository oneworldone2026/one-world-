<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OPEN RADAR</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f5f5f5;
  color: #222;
}

header {
  background: #111;
  color: #fff;
  padding: 24px 20px;
}

header h1 {
  margin: 0;
  font-size: 30px;
}

header p {
  margin: 8px 0 0;
  color: #ccc;
}

main {
  max-width: 900px;
  margin: auto;
  padding: 20px;
}

.card {
  background: #fff;
  border-radius: 16px;
  padding: 20px;
  margin-bottom: 18px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.08);
}

input, select {
  width: 100%;
  padding: 14px;
  margin: 6px 0;
  border: 1px solid #ccc;
  border-radius: 9px;
  font-size: 16px;
}

button, .link {
  display: block;
  width: 100%;
  padding: 14px;
  margin-top: 12px;
  border: 0;
  border-radius: 9px;
  background: #222;
  color: #fff;
  text-align: center;
  text-decoration: none;
  font-size: 16px;
}

.badge {
  display: inline-block;
  padding: 5px 9px;
  margin: 3px;
  background: #eee;
  border-radius: 8px;
  font-size: 13px;
}

.small {
  color: #666;
  line-height: 1.6;
}

.hidden { display: none; }

.error {
  color: #b00020;
  font-weight: bold;
}
</style>
</head>

<body>

<header>
  <h1>OPEN RADAR</h1>
  <p>公開情報を、見つけやすく。</p>
</header>

<main>

<section id="listPage">

  <div class="card">
    <h2>公開情報を探す</h2>

    <input
      id="keyword"
      type="search"
      placeholder="キーワード・施設名・地域など"
    >

    <select id="category">
      <option value="">分野：すべて</option>
    </select>

    <select id="prefecture">
      <option value="">都道府県：すべて</option>
    </select>

    <select id="city">
      <option value="">市町村：すべて</option>
    </select>

    <p id="status" class="small">
      データを読み込み中...
    </p>
  </div>

  <div id="results"></div>

</section>

<section id="detailPage" class="hidden">

  <div class="card">
    <button id="backButton">← 一覧に戻る</button>
    <div id="detail"></div>
  </div>

</section>

</main>

<script>

let datasets = [];

async function loadData() {
  try {
    const response = await fetch("./otsu-data.json?v=" + Date.now());

    if (!response.ok) {
      throw new Error("HTTP " + response.status);
    }

    const data = await response.json();

    if (!data || !Array.isArray(data.datasets)) {
      throw new Error("Invalid data");
    }

    datasets = data.datasets;

    makeFilters();
    searchData();

  } catch (error) {
    console.error(error);

    document.getElementById("status").innerHTML =
      '<span class="error">データを読み込めませんでした。</span>';
  }
}

function makeFilters() {
  addOptions("category", datasets.map(item => item.category));
  addOptions("prefecture", datasets.map(item => item.prefecture));
  addOptions("city", datasets.map(item => item.city));
}

function addOptions(id, values) {
  const select = document.getElementById(id);
  const unique = [...new Set(values.filter(Boolean))];

  unique.forEach(value => {
    const option = document.createElement("option");
    option.value = value;
    option.textContent = value;
    select.appendChild(option);
  });
}

function searchData() {
  const keyword =
    document.getElementById("keyword").value.trim().toLowerCase();

  const category =
    document.getElementById("category").value;

  const prefecture =
    document.getElementById("prefecture").value;

  const city =
    document.getElementById("city").value;

  const filtered = datasets.filter(item => {
    const text = [
      item.title,
      item.description,
      item.category,
      item.prefecture,
      item.city,
      item.publisher
    ]
    .filter(Boolean)
    .join(" ")
    .toLowerCase();

    return (
      (!keyword || text.includes(keyword)) &&
      (!category || item.category === category) &&
      (!prefecture || item.prefecture === prefecture) &&
      (!city || item.city === city)
    );
  });

  renderResults(filtered);
}

function renderResults(items) {
  const results = document.getElementById("results");

  document.getElementById("status").textContent =
    items.length + "件の公開情報";

  results.innerHTML = "";

  items.forEach(item => {
    const index = datasets.indexOf(item);
    const card = document.createElement("div");

    card.className = "card";

    const title = document.createElement("h2");
    title.textContent = item.title || "名称未設定";
    card.appendChild(title);

    const info = document.createElement("p");
    info.className = "small";
    info.textContent =
      (item.prefecture || "") + " " +
      (item.city || "") + " / " +
      (item.publisher || "");
    card.appendChild(info);

    const button = document.createElement("button");
    button.textContent = "詳細を見る";

    button.addEventListener("click", () => {
      showDetail(index);
    });

    card.appendChild(button);
    results.appendChild(card);
  });
}

function showDetail(index) {
  const item = datasets[index];

  if (!item) return;

  document.getElementById("listPage").classList.add("hidden");
  document.getElementById("detailPage").classList.remove("hidden");

  const detail = document.getElementById("detail");
  detail.innerHTML = "";

  const title = document.createElement("h2");
  title.textContent = item.title || "名称未設定";
  detail.appendChild(title);

  const info = document.createElement("p");
  info.className = "small";

  info.textContent =
    "地域：" +
    (item.prefecture || "") +
    " " +
    (item.city || "") +
    " / 公開元：" +
    (item.publisher || "") +
    " / 形式：" +
    (item.format || "");

  detail.appendChild(info);

  if (item.file_url) {
    const fileLink = document.createElement("a");

    fileLink.className = "link";
    fileLink.href = item.file_url;
    fileLink.target = "_blank";
    fileLink.rel = "noopener";
    fileLink.textContent = "📊 公開データを開く";

    detail.appendChild(fileLink);
  }

  if (item.source_url) {
    const sourceLink = document.createElement("a");

    sourceLink.className = "link";
    sourceLink.href = item.source_url;
    sourceLink.target = "_blank";
    sourceLink.rel = "noopener";
    sourceLink.textContent = "🌐 公開元の公式ページ";

    detail.appendChild(sourceLink);
  }

  const description = document.createElement("p");
  description.className = "small";
  description.textContent = item.description || "";

  detail.appendChild(description);

  window.scrollTo(0, 0);
}

function showList() {
  document.getElementById("detailPage").classList.add("hidden");
  document.getElementById("listPage").classList.remove("hidden");
  window.scrollTo(0, 0);
}

document
  .getElementById("keyword")
  .addEventListener("input", searchData);

document
  .getElementById("category")
  .addEventListener("change", searchData);

document
  .getElementById("prefecture")
  .addEventListener("change", searchData);

document
  .getElementById("city")
  .addEventListener("change", searchData);

document
  .getElementById("backButton")
  .addEventListener("click", showList);

loadData();

</script>

</body>
</html>
