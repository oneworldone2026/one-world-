<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>OPEN RADAR 試作1号</title>
<style>
body{font-family:system-ui,sans-serif;margin:0;background:#f5f7fa;color:#17202a}
header{background:#111827;color:white;padding:22px 16px}
main{max-width:760px;margin:auto;padding:16px}
input,select{width:100%;padding:13px;margin:6px 0 14px;border:1px solid #d1d5db;border-radius:10px;box-sizing:border-box;background:white}
.card{background:white;border:1px solid #e5e7eb;border-radius:14px;padding:16px;margin:12px 0}
.badge{display:inline-block;padding:4px 8px;border-radius:999px;background:#eef2ff;font-size:12px;margin-right:5px}
a{display:inline-block;margin-top:12px;text-decoration:none;font-weight:700}
.small{font-size:13px;color:#667085}
</style>
</head>
<body>
<header><strong>OPEN RADAR</strong><div>全国の公開情報から営業機会を探す</div></header>
<main>
<h2>新着案件（試作）</h2>
<input id="q" placeholder="案件名・地域・用途で検索">
<select id="type"><option value="">すべての用途</option></select>
<div id="list"></div>
<p class="small">※試作版。情報は大阪市の公開ページを元にしたサンプルです。必ず原資料をご確認ください。</p>
</main>
<script>
const data = [
["（仮称）エスリード浪速区浪速西3丁目新築工事","共同住宅","大阪市浪速区"],
["（仮称）浪速区元町一丁目計画 新築工事","ホテル","大阪市浪速区"],
["恩加島事業センター2,3F 棟","工場","大阪市大正区"],
["（仮称）大阪成蹊大学駅前キャンパスII期（West館）新築工事","大学","大阪市東淀川区"],
["（仮称）松源浪速店新築工事","物販店舗","大阪市浪速区"],
["興國高等学校 南館増築工事","高等学校","大阪市天王寺区"],
["（仮称）平野複合開発（物流）新築工事","倉庫業を営む倉庫","大阪市平野区"],
["医療法人高遼会 高遼会病院 新築工事","病院","大阪市東住吉区"],
["（仮称）大阪鶴橋ホテル新築工事","ホテル又は旅館","大阪市生野区"],
["大阪市立九条南小学校","小学校","大阪市西区"]
];
const list=document.getElementById("list"), q=document.getElementById("q"), type=document.getElementById("type");
[...new Set(data.map(x=>x[1]))].sort().forEach(x=>type.add(new Option(x,x)));
function render(){
 const s=q.value.toLowerCase(), t=type.value;
 list.innerHTML=data.filter(x=>(!s||x.join(" ").toLowerCase().includes(s))&&(!t||x[1]===t))
 .map(x=>`<article class="card"><h3>${x[0]}</h3><span class="badge">${x[1]}</span><span class="badge">${x[2]}</span><div class="small">公開元：大阪市　令和8年度</div><a href="https://www.city.osaka.lg.jp/toshikeikaku/page/0000678347.html" target="_blank" rel="noopener">原資料・公開元を見る →</a></article>`).join("") || "<p>該当する案件はありません。</p>";
}
q.oninput=render; type.onchange=render; render();
</script>
</body>
</html>
