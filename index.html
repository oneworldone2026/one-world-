<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ONE WORLD</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #222;
      text-align: center;
    }

    header {
      background: #111;
      color: white;
      padding: 25px 15px;
    }

    header h1 {
      margin: 0;
      font-size: 36px;
      letter-spacing: 3px;
    }

    header p {
      margin: 10px 0 0;
      font-size: 15px;
    }

    .container {
      max-width: 700px;
      margin: 40px auto;
      padding: 0 20px;
    }

    .card {
      background: white;
      border-radius: 20px;
      padding: 35px 20px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.08);
    }

    .message {
      font-size: 22px;
      font-weight: bold;
      line-height: 1.6;
      margin-bottom: 25px;
    }

    .counter {
      font-size: 52px;
      font-weight: bold;
      margin: 25px 0;
    }

    .yen {
      font-size: 24px;
      margin-left: 5px;
    }

    .button {
      display: inline-block;
      background: #111;
      color: white;
      padding: 16px 35px;
      border-radius: 50px;
      text-decoration: none;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      border: none;
    }

    .button:hover {
      opacity: 0.8;
    }

    .info {
      margin-top: 30px;
      font-size: 14px;
      line-height: 1.8;
      color: #666;
    }

    .sponsors {
      margin-top: 35px;
      padding-top: 25px;
      border-top: 1px solid #ddd;
    }

    .sponsors h2 {
      font-size: 20px;
    }

    footer {
      margin-top: 50px;
      padding: 25px;
      background: #111;
      color: #aaa;
      font-size: 12px;
    }
  </style>
</head>

<body>

  <header>
    <h1>ONE WORLD</h1>
    <p>世界中から、1円。</p>
  </header>

  <div class="container">

    <div class="card">

      <div class="message">
        世界中の人から<br>
        たった1円ずつ集めたら、<br>
        何ができるだろう？
      </div>

      <div class="counter" id="counter">
        0<span class="yen">円</span>
      </div>

      <button class="button" onclick="addOne()">
        1円を追加する
      </button>

      <div class="info">
        これはテスト版です。<br>
        現在は画面上のカウンターだけが動きます。
      </div>

      <div class="sponsors">
        <h2>SPONSORS</h2>
        <p>スポンサー募集予定</p>
      </div>

    </div>

  </div>

  <footer>
    ONE WORLD PROJECT
  </footer>

  <script>
    let total = 0;

    function addOne() {
      total++;
      document.getElementById("counter").innerHTML =
        total.toLocaleString() + '<span class="yen">円</span>';
    }
  </script>

</body>
</html>
