<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>OPEN RADAR</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:#f4f6f8;
  color:#222;
}
header{
  background:#111;
  color:#fff;
  padding:24px 18px;
}
header h1{margin:0;font-size:30px}
header p{margin:7px 0 0;color:#ccc}
main{max-width:950px;margin:auto;padding:16px}
.card{
  background:#fff;
  border-radius:14px;
  padding:18px;
  margin-bottom:14px;
  box-shadow:0 2px 8px #0001;
}
input,select{
  width:100%;
  padding:13px;
  margin:6px 0 12px;
  border:1px solid #ccc;
  border-radius:9px;
  font-size:16px;
}
button,.link{
  display:inline-block;
  border:0;
  border-radius:9px;
  padding:11px 15px;
  background:#222;
  color:#fff;
  text-decoration:none;
  margin:4px 4px 4px 0;
  font-size:15px;
}
.badge{
  display:inline-block;
  background:#eee;
  padding:5px 9px;
  border-radius:20px;
  font-size:13px;
}
.small{
  color:#666;
  font-size:13px;
  line-height:1.7;
}
.item{
  border:1px solid #ddd;
  border-radius:12px;
  padding:15px;
  margin-top:10px;
}
.hidden{display:none}
.back{background:#666}
.notice{
  background:#fff8df;
  border:1px solid #eadb9a;
  border-radius:9px;
  padding:12px;
  font-size:13px;
}
</style>
</head>

<body>

<header>
<h1>OPEN RADAR</h1>
<p>公開情報を、見つけやすく。</p>
</header>

<main>

<!-- TOP -->
<section id="home">

<div class="card">

<h2>🔎 公開情報を探す</h2>

<input
id="keyword"
placeholder="施設名・データ名・キーワード"
oninput="searchData()"
>

<select id="area" onchange="searchData()">
<option value="">地域：すべて</option>
<option value="滋賀県">滋賀県</option>
</select>

<select id="city" onchange="searchData()">
<option value="">市町村：すべて</option>
<option value="大津市">大津市</option>
</select>

<select id="format" onchange="searchData()">
<option value="">形式：すべて</option>
<option value="CSV">CSV</option>
<option value="JSON">JSON</option>
<option value="RDF">RDF</option>
<option value="XLS">XLS</option>
<option value="XLSX">XLSX</option>
<option value="PDF">PDF</option>
</select>

<p id="count" class="small"></p>

</div>

<div id="results"></div>

</section>


<!-- DETAIL -->
<section id="detail" class="hidden">

<div class="card">

<button class="back" onclick="goHome()">← 一覧へ戻る</button>

<div id="detailBody"></div>

</div>

</section>


<div class="card">

<h3>OPEN RADARについて</h3>

<p class="small">
国・自治体等が公開している情報を、公開元の利用条件を確認したうえで整理・表示します。
</p>

<p class="small">
OPEN RADARが営業先、必要な工事、更新時期などを判断・推奨するものではありません。
情報の利用・判断は利用者自身で行ってください。
</p>

<p class="small">
各情報の詳細・最新性については、必ず公開元の公式情報をご確認ください。
</p>

</div>

</main>


<script>

let datasets=[];


async function loadData(){

try{

const response=await fetch("otsu-data.json");

if(!response.ok) throw new Error();

const data=await response.json();

datasets=data.datasets || [];

searchData();

}catch(e){

document.getElementById("count").textContent=
"データを読み込めませんでした。";

}

}


function searchData(){

const keyword=
document.getElementById("keyword").value.toLowerCase();

const area=
document.getElementById("area").value;

const city=
document.getElementById("city").value;

const format=
document.getElementById("format").value;

const results=
document.getElementById("results");

results.innerHTML="";


const found=datasets.filter(x=>{

const text=(
x.title+" "+
x.category+" "+
x.publisher+" "+
x.prefecture+" "+
x.city+" "+
x.description
).toLowerCase();

const formats=String(x.format||"").toUpperCase();

return(
(!keyword || text.includes(keyword)) &&
(!area || x.prefecture===area) &&
(!city || x.city===city) &&
(!format || formats.includes(format))
);

});


document.getElementById("count").textContent=
found.length+"件";


found.forEach((x,i)=>{

const div=document.createElement("div");

div.className="card item";

div.innerHTML=`

<span class="badge">
${safe(x.format || "形式不明")}
</span>

<h3>${safe(x.title)}</h3>

<p class="small">

地域：
${safe(x.prefecture || "")}
${safe(x.city || "")}<br>

公開元：
${safe(x.publisher || "")}<br>

データ時点：
${safe(x.data_as_of || "記載なし")}<br>

更新日：
${safe(x.published || "記載なし")}

</p>

<button onclick="showDetail(${i})">
詳細を見る
</button>

`;

results.appendChild(div);

});

}


function showDetail(index){

const x=datasets[index];

document.getElementById("home")
.classList.add("hidden");

document.getElementById("detail")
.classList.remove("hidden");


let html=`

<span class="badge">
${safe(x.format || "形式不明")}
</span>

<h2>${safe(x.title)}</h2>

<p>

<b>地域：</b>
${safe(x.prefecture || "")}
${safe(x.city || "")}<br>

<b>公開元：</b>
${safe(x.publisher || "")}<br>

<b>データ時点：</b>
${safe(x.data_as_of || "記載なし")}<br>

<b>更新日：</b>
${safe(x.published || "記載なし")}

</p>

`;


if(x.description){

html+=`
<div class="item">
<h3>概要</h3>
<p class="small">
${safe(x.description)}
</p>
</div>
`;

}


html+=`
<div class="item">

<h3>見る</h3>

`;

if(x.source_url){

html+=`
<a
class="link"
href="${safeAttr(x.source_url)}"
target="_blank"
rel="noopener">
🌐 公式ページ
</a>
`;

}


if(x.file_url){

html+=`
<a
class="link"
href="${safeAttr(x.file_url)}"
target="_blank"
rel="noopener">
📄 元データを開く
</a>
`;

}else{

html+=`
<p class="small">
現在、元ファイルの直接URLは登録されていません。
公式ページから元データをご確認ください。
</p>
`;

}


html+=`

</div>

<div class="notice">

OPEN RADARは公開元の情報を整理して表示しています。
内容の利用・判断は利用者自身で行ってください。

</div>

`;


document.getElementById("detailBody").innerHTML=html;

}


function goHome(){

document.getElementById("detail")
.classList.add("hidden");

document.getElementById("home")
.classList.remove("hidden");

}


function safe(v){

return String(v??"")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


function safeAttr(v){

return safe(v);

}


loadData();

</script>

</body>
</html>
