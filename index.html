<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OPEN RADAR</title>
  <style>
    *{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f5f5f5;color:#222}header{background:#111;color:#fff;padding:28px 20px}header h1{margin:0 0 8px;font-size:32px;letter-spacing:.5px}header p{margin:0;color:#cfcfcf;font-size:18px}.wrap{max-width:980px;margin:0 auto;padding:28px 16px}.panel,.card{background:#fff;border-radius:20px;box-shadow:0 4px 18px rgba(0,0,0,.08);padding:24px;margin-bottom:22px}.panel h2,.card h2{margin:0 0 18px;font-size:28px}.search{width:100%;padding:16px 18px;border:1px solid #d2d2d2;border-radius:14px;font-size:17px}.filters{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:12px}.filters select{width:100%;padding:15px;border:1px solid #d2d2d2;border-radius:14px;font-size:16px;background:#f2f2f2}.meta{color:#666;line-height:1.8}.badges{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}.badge{background:#efefef;border-radius:999px;padding:7px 11px;font-size:13px}.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:18px}.btn{display:block;text-align:center;text-decoration:none;border:0;border-radius:14px;padding:15px 14px;font-size:16px;font-weight:700;cursor:pointer;background:#222;color:#fff}.btn.secondary{background:#ededed;color:#222}.btn.outline{background:#fff;color:#222;border:1px solid #bbb}.status{margin-top:14px;color:#666}.hidden{display:none!important}.viewer-head{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}.viewer-tools{display:flex;gap:8px;flex-wrap:wrap}.sales-tools{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:14px}.sales-tools select{width:100%;padding:12px;border:1px solid #ccc;border-radius:10px;background:#fff;font-size:15px}.hint{font-size:13px;color:#666;line-height:1.6;margin-top:8px}.smallbtn{border:1px solid #bbb;background:#fff;border-radius:10px;padding:10px 12px;cursor:pointer}.count{font-weight:700}.table-wrap{overflow:auto;border:1px solid #ddd;border-radius:14px;margin-top:14px;background:#fff}.data-table{width:100%;border-collapse:collapse;min-width:980px}.data-table th,.data-table td{padding:10px 12px;border-bottom:1px solid #eee;text-align:left;vertical-align:top;font-size:14px}.data-table th{position:sticky;top:0;background:#f3f3f3;z-index:1}.cards{display:none}.data-card{border:1px solid #ddd;border-radius:14px;padding:14px;margin-top:10px;background:#fff}.data-card h3{margin:0 0 8px;font-size:18px}.kv{font-size:14px;line-height:1.7}.warn{background:#fff4d6;border:1px solid #efcc65;border-radius:12px;padding:12px;margin-top:12px}.about{color:#666;line-height:1.8}.loader{display:inline-block;width:16px;height:16px;border:2px solid #ccc;border-top-color:#333;border-radius:50%;animation:spin .7s linear infinite;vertical-align:-3px;margin-right:6px}@keyframes spin{to{transform:rotate(360deg)}}
    @media(max-width:700px){.sales-tools{grid-template-columns:1fr}header h1{font-size:30px}.filters{grid-template-columns:1fr}.actions{grid-template-columns:1fr}.panel,.card{padding:20px}.panel h2,.card h2{font-size:25px}.table-wrap{display:none}.cards{display:block}.viewer-tools{width:100%}.viewer-tools input{width:100%}}
  </style>
</head>
<body>
<header><h1>OPEN RADAR</h1><p>公開情報を、見つけやすく。</p></header>
<main class="wrap">
  <section class="panel" id="listPage">
    <h2>公開情報を探す</h2>
    <input id="keyword" class="search" type="search" placeholder="キーワード・施設名・地域など">
    <div class="filters">
      <select id="category"><option value="">分野：すべて</option><option value="施設・店舗">施設・店舗</option><option value="建築・開発">建築・開発</option></select>
      <select id="prefecture"><option value="">都道府県：すべて</option><option value="滋賀県">滋賀県</option></select>
      <select id="city"><option value="">市町村：すべて</option><option value="大津市">大津市</option></select>
    </div>
    <div id="resultCount" class="status">2件の公開情報</div>
  </section>

  <section class="card dataset-card" data-search="食品営業許可施設一覧 大津市 滋賀県 施設 店舗 食品 営業 許可">
    <h2>食品営業許可施設一覧</h2>
    <div class="meta">滋賀県 大津市 / 公開元：大津市</div>
    <div class="badges"><span class="badge">CSV</span><span class="badge">2026年7月末時点</span><span class="badge" id="recordBadge">件数を確認中</span></div>
    <p class="meta">施設名、所在地、業種、許可期間などを確認できます。OPEN RADAR内では文字化け・列崩れを確認したうえで表示します。</p>
    <div class="actions">
      <button class="btn" id="openViewer">中身を見る</button>
      <a class="btn secondary" href="./od_2607.csv" target="_blank" rel="noopener">元データ（CSV）</a>
      <a class="btn outline" href="https://www.city.otsu.lg.jp/soshiki/021/1441/od/02594.html" target="_blank" rel="noopener">公式公開ページ</a>
    </div>
    <div id="qualityStatus" class="status"></div>
