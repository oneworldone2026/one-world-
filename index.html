<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>OPEN RADAR｜公開情報検索</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,sans-serif;background:#f4f6f8;color:#222}
header{background:#111;color:#fff;padding:24px 18px}
header h1{margin:0;font-size:30px}
header p{margin:8px 0 0;color:#ccc}
main{max-width:900px;margin:auto;padding:16px}
.card{background:#fff;border-radius:14px;padding:18px;margin-bottom:14px;box-shadow:0 2px 8px #0001}
h2{margin-top:0}
input,select{width:100%;padding:13px;margin:6px 0 12px;border:1px solid #ccc;border-radius:9px;font-size:16px}
button,.link{display:inline-block;border:0;border-radius:9px;padding:11px 15px;background:#222;color:#fff;text-decoration:none;margin:4px 4px 4px 0;font-size:15px}
.badge{display:inline-block;background:#eee;padding:5px 9px;border-radius:20px;font-size:13px}
.small{font-size:13px;color:#666;line-height:1.7}
.item{border:1px solid #ddd;border-radius:12px;padding:15px;margin-top:10px}
.hidden{display:none}
.back{background:#666}
</style>
</head>

<body>

<header>
<h1>OPEN RADAR</h1>
<p>公開情報を、見つけやすく。</p>
</header>

<main>

<!-- トップ -->
<section id="home">
<div class="card">
<h2>公開情報を探す</h2>

<input id="keyword"
placeholder="施設名・地域・キーワードで検索">

<select id="area">
<option value="">都道府県を選択</option>
<option value="滋賀県">滋賀県</option>
</select>

<select id="city">
<option value="">市町村を選択</option>
<option value="大津市">大津市</option>
</select>

<select id="category">
<option value="">分野を選択</option>
<option value="施設・店舗">施設・店舗</option>
<option value="医療・介護">医療・介護</option>
<option value="建物・都市計画">建物・都市計画</option>
<option value="維持管理">維持管理</option>
<option value="清掃・廃棄物">清掃・廃棄物</option>
<option value="警備">警備</option>
<option value="設備">設備</option>
<option value="その他">その他</option>
</select>

<button onclick="searchData()">🔎 情報を探す</button>
</div>

<div class="card">
<h3>OPEN RADARの考え方</h3>
<p class="small">
国・自治体等が公開している情報を、利用条件を確認したうえで整理・表示します。
営業先や必要なサービスをOPEN RADARが判断するものではありません。
</p>
</div>

<div id="results"></div>
</section>


<!-- 詳細 -->
<section id="detail" class="hidden">
<div class="card">
<button class="back" onclick="goHome()">← 一覧へ戻る</button>
<div id="detailBody"></div>
</div>
</section>

</main>

<script>

let datasets=[];

async function load(){

try{

const r=await fetch("otsu-data.json");
const data=await r.json();

datasets=data.datasets || [];

}catch(e){

console.log(e);

}

}

function searchData(){

const keyword=
document.getElementById("keyword").value.toLowerCase();

const area=
document.getElementById("area").value;

const city=
document.getElementById("city").value;

const category=
document.getElementById("category").value;

const results=document.getElementById("results");

results.innerHTML="";

const found=datasets.filter(x=>{

const text=(
x.title+" "+
x.category+" "+
x.publisher+" "+
(area||"")+
(city||"")
).toLowerCase();

return (!keyword || text.includes(keyword))
&& (!category || x.category===category);

});

if(found.length===0){

results.innerHTML=
'<div class="card">該当する公開情報はありません。</div>';

return;

}

found.forEach((x,i)=>{

const div=document.createElement("div");

div.className="card item";

div.innerHTML=`

<span class="badge">
${safe(x.category||"その他")}
</span>

<h3>${safe(x.title)}</h3>

<p class="small">
公開元：${safe(x.publisher||"")}<br>
データ時点：${safe(x.data_as_of||"")}<br>
公開・更新日：${safe(x.published||"")}
</p>

<button onclick="showDetail(${i})">
詳細を見る
</button>

`;

results.appendChild(div);

});

}

function showDetail(index){

const x=datasets[index];

document.getElementById("home").classList.add("hidden");
document.getElementById("detail").classList.remove("hidden");

document.getElementById("detailBody").innerHTML=`

<span class="badge">
${safe(x.category||"その他")}
</span>

<h2>${safe(x.title)}</h2>

<p>
<b>公開元：</b>${safe(x.publisher||"")}<br>
<b>データ時点：</b>${safe(x.data_as_of||"")}<br>
<b>公開・更新日：</b>${safe(x.published||"")}
</p>

<hr>

<h3>資料・公式情報</h3>

<p class="small">
元データの形式にかかわらず、確認できる資料を
OPEN RADARから直接たどれるようにします。
</p>

<a class="link"
href="${safeAttr(x.source_url||"#")}"
target="_blank"
rel="noopener">
🌐 公式ページを開く
</a>

${
x.file_url
?
`<a class="link"
href="${safeAttr(x.file_url)}"
target="_blank"
rel="noopener">
📄 元資料を開く
</a>`
:""
}

<div class="item">
<h3>利用条件</h3>
<p class="small">
${safe(x.license||"公開元の利用条件をご確認ください。")}
</p>
</div>

<div class="item">
<h3>OPEN RADARについて</h3>
<p class="small">
この情報は公開元の情報を整理して表示しています。
最新情報・正確性については必ず公式情報をご確認ください。
</p>
</div>

`;

}

function goHome(){

document.getElementById("detail").classList.add("hidden");
document.getElementById("home").classList.remove("hidden");

}

function safe(v){

return String(v??"")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}

function safeAttr(v){

return safe(v);

}

load();

</script>

</body>
</html>
