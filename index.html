<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>OPEN RADAR</title>
<style>
body{font-family:system-ui,sans-serif;margin:0;background:#f5f6f8;color:#222}
header{background:#111;color:#fff;padding:22px 16px}
header h1{margin:0;font-size:28px}
header p{margin:6px 0 0;color:#ccc}
main{max-width:900px;margin:auto;padding:18px}
.card{background:#fff;border-radius:14px;padding:18px;margin-bottom:14px;box-shadow:0 2px 8px #0001}
input,select{width:100%;box-sizing:border-box;padding:13px;margin:6px 0 14px;border:1px solid #ccc;border-radius:9px;font-size:16px}
.badge{display:inline-block;background:#eee;padding:5px 9px;border-radius:20px;font-size:13px;margin:3px}
.small{font-size:13px;color:#666}
a{color:#0758a8}
#status{font-weight:bold}
</style>
</head>

<body>

<header>
<h1>OPEN RADAR</h1>
<p>公開情報を整理して、見つけやすくする。</p>
</header>

<main>

<div class="card">
<h2>大津市</h2>
<p>公開情報から確認できる施設情報</p>

<input id="search" placeholder="施設名・住所で検索">

<select id="category">
<option value="">すべての区分</option>
</select>

<p id="status">データを読み込んでいます…</p>
</div>

<div id="results"></div>

<div class="card">
<h3>情報について</h3>
<p class="small">
このページは、国・自治体等が公開している情報を、利用条件を確認したうえで整理・表示するものです。
OPEN RADARが営業先、必要なサービス、将来の需要等を判断・推奨するものではありません。
利用者による判断・利用については、各公開元の情報をご確認ください。
</p>
<p class="small">
出典・データ時点・取得日等は各データに表示します。
</p>
</div>

</main>

<script>
let data=[];

async function loadData(){
  try{
    const res=await fetch("otsu-data.json");
    if(!res.ok) throw new Error("data error");
    const json=await res.json();

    data=json.records || [];

    const categories=[...new Set(data.map(x=>x.category).filter(Boolean))];
    const select=document.getElementById("category");

    categories.forEach(c=>{
      const option=document.createElement("option");
      option.value=c;
      option.textContent=c;
      select.appendChild(option);
    });

    document.getElementById("status").textContent=
      data.length+"件の公開情報を表示";

    render();
  }catch(e){
    document.getElementById("status").textContent=
      "データを読み込めませんでした";
  }
}

function render(){
  const keyword=document.getElementById("search").value.toLowerCase();
  const category=document.getElementById("category").value;

  const filtered=data.filter(x=>{
    const text=(x.name+" "+x.address).toLowerCase();
    return (!keyword || text.includes(keyword))
      && (!category || x.category===category);
  });

  const box=document.getElementById("results");
  box.innerHTML="";

  filtered.forEach(x=>{
    const card=document.createElement("div");
    card.className="card";

    card.innerHTML=`
      <h2>${x.name || ""}</h2>
      <span class="badge">${x.category || "施設情報"}</span>
      <p>${x.address || ""}</p>
      <p class="small">
        情報区分：${x.information_type || "公開情報"}<br>
        公開元：${dataSource("publisher")}<br>
        データ時点：${dataSource("data_as_of")}<br>
        OPEN RADAR取得日：${dataSource("radar_added")}
      </p>
    `;

    box.appendChild(card);
  });

  if(filtered.length===0){
    box.innerHTML='<div class="card">該当する情報はありません。</div>';
  }
}

function dataSource(key){
  return window.otsuSource ? window.otsuSource[key] || "" : "";
}

document.getElementById("search").addEventListener("input",render);
document.getElementById("category").addEventListener("change",render);

fetch("otsu-data.json")
.then(r=>r.json())
.then(j=>{
  window.otsuSource=j.source || {};
  data=j.records || [];

  const select=document.getElementById("category");
  [...new Set(data.map(x=>x.category).filter(Boolean))].forEach(c=>{
    const o=document.createElement("option");
    o.value=c;
    o.textContent=c;
    select.appendChild(o);
  });

  document.getElementById("status").textContent=data.length+"件の公開情報を表示";
  render();
})
.catch(()=>{
  document.getElementById("status").textContent="データを読み込めませんでした";
});
</script>

</body>
</html>
