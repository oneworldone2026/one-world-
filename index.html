<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>OPEN RADAR</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,sans-serif;background:#f4f6f8;color:#222}
header{background:#111;color:#fff;padding:22px 16px}
header h1{margin:0;font-size:30px}
header p{margin:6px 0 0;color:#ccc}
main{max-width:1000px;margin:auto;padding:16px}
.card{background:#fff;border-radius:14px;padding:18px;margin-bottom:14px;box-shadow:0 2px 8px #0001}
input,select{width:100%;padding:13px;margin:6px 0 12px;border:1px solid #ccc;border-radius:9px;font-size:16px}
button,.link{display:inline-block;border:0;border-radius:9px;padding:11px 15px;background:#222;color:#fff;text-decoration:none;margin:4px 4px 4px 0;font-size:15px}
.back{background:#666}
.badge{display:inline-block;background:#eee;padding:5px 9px;border-radius:20px;font-size:13px}
.small{font-size:13px;color:#666;line-height:1.7}
.item{border:1px solid #ddd;border-radius:12px;padding:15px;margin-top:10px}
.hidden{display:none}
.notice{background:#fff8df;border:1px solid #eadb9a;border-radius:9px;padding:12px;font-size:13px}
.table-wrap{overflow:auto;margin-top:15px;border:1px solid #ddd}
table{border-collapse:collapse;width:100%;min-width:700px;background:#fff}
th,td{border:1px solid #ddd;padding:9px;text-align:left;font-size:13px}
th{background:#eee;position:sticky;top:0}
</style>
</head>

<body>

<header>
<h1>OPEN RADAR</h1>
<p>公開情報を、見つけやすく。</p>
</header>

<main>

<section id="home">

<div class="card">
<h2>🔎 公開情報を探す</h2>

<input id="keyword" placeholder="施設名・データ名・キーワード"
oninput="searchData()">

<select id="area" onchange="searchData()">
<option value="">地域：すべて</option>
<option value="滋賀県">滋賀県</option>
</select>

<select id="city" onchange="searchData()">
<option value="">市町村：すべて</option>
<option value="大津市">大津市</option>
</select>

<select id="format" onchange="searchData()">
<option value="">形式：すべて</option>
<option value="CSV">CSV</option>
<option value="JSON">JSON</option>
<option value="RDF">RDF</option>
<option value="XLS">XLS</option>
<option value="XLSX">XLSX</option>
<option value="PDF">PDF</option>
</select>

<p id="count" class="small"></p>
</div>

<div id="results"></div>

</section>


<section id="detail" class="hidden">
<div class="card">
<button class="back" onclick="goHome()">← 一覧へ戻る</button>
<div id="detailBody"></div>
</div>
</section>


<section id="viewer" class="hidden">
<div class="card">

<button class="back" onclick="closeViewer()">← 詳細へ戻る</button>

<h2 id="viewerTitle">データを見る</h2>

<div class="notice">
公開元のCSVデータをOPEN RADAR内で表形式に表示しています。
</div>

<input id="tableSearch"
placeholder="このデータの中を検索"
oninput="renderTable()">

<p id="tableCount" class="small"></p>

<div class="table-wrap">
<table id="dataTable"></table>
</div>

</div>
</section>


<div class="card">
<h3>OPEN RADARについて</h3>
<p class="small">
国・自治体等が公開している情報を、公開元の利用条件を確認したうえで整理・表示します。
</p>
<p class="small">
最新情報・正確性については必ず公開元の公式情報をご確認ください。
</p>
</div>

</main>

}catch(e){

document.getElementById("count").textContent=
"データを読み込めませんでした。";

}

}
