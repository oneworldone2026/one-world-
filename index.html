<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>OPEN RADAR</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:#f4f6f8;
  color:#222;
}
header{
  background:#111;
  color:white;
  padding:24px 18px;
}
header h1{margin:0;font-size:30px}
header p{margin:7px 0 0;color:#ccc}

main{
  max-width:900px;
  margin:auto;
  padding:18px;
}

.card{
  background:white;
  border-radius:14px;
  padding:18px;
  margin-bottom:15px;
  box-shadow:0 2px 8px #00000012;
}

input,select{
  width:100%;
  padding:13px;
  margin:6px 0 12px;
  border:1px solid #ccc;
  border-radius:9px;
  font-size:16px;
}

.dataset{
  border:1px solid #ddd;
  border-radius:12px;
  padding:16px;
  margin-top:12px;
}

.dataset h2{
  margin:0 0 8px;
  font-size:19px;
}

.badge{
  display:inline-block;
  background:#eee;
  padding:5px 9px;
  border-radius:20px;
  font-size:13px;
  margin-bottom:8px;
}

button,a.button{
  display:inline-block;
  padding:10px 14px;
  border-radius:8px;
  border:0;
  background:#222;
  color:white;
  text-decoration:none;
  margin-top:8px;
  cursor:pointer;
}

.detail{
  display:none;
}

.small{
  font-size:13px;
  color:#666;
  line-height:1.7;
}

.source{
  border-top:1px solid #ddd;
  margin-top:14px;
  padding-top:12px;
}
</style>
</head>

<body>

<header>
  <h1>OPEN RADAR</h1>
  <p>公開情報を、見つけやすく。</p>
</header>

<main>

<div id="listPage">

  <div class="card">
    <h2>地域を選択</h2>
    <select id="areaSelect">
      <option value="otsu">大津市</option>
    </select>
  </div>

  <div class="card">
    <h2>公開情報を検索</h2>

    <input
      id="search"
      placeholder="施設名・事業・キーワードなど"
    >

    <select id="category">
      <option value="">すべての分野</option>
    </select>

    <p id="status" class="small">読み込み中…</p>
  </div>

  <div id="datasets"></div>

</div>


<div id="detailPage" class="detail">

  <div class="card">

    <button onclick="showList()">← 一覧へ戻る</button>

    <div id="detailContent"></div>

  </div>

</div>


<div class="card">
  <h3>OPEN RADARについて</h3>

  <p class="small">
  OPEN RADARは、国・自治体等が公開している情報を、
  各公開元の利用条件を確認したうえで整理・表示するサービスです。
  </p>

  <p class="small">
  OPEN RADARが営業先、必要な工事・サービス、将来の需要等を
  判断・推奨するものではありません。
  情報の利用・判断は利用者自身で行ってください。
  </p>

  <p class="small">
  各情報の詳細については、必ず公開元の公式情報をご確認ください。
  </p>
</div>

</main>


<script>

let radarData=null;


async function loadData(){

  try{

    const response=await fetch("otsu-data.json");

    if(!response.ok){
      throw new Error("data error");
    }

    radarData=await response.json();

    buildCategories();
    renderDatasets();

  }catch(error){

    document.getElementById("status").textContent=
      "データを読み込めませんでした。";

  }

}


function buildCategories(){

  const select=document.getElementById("category");

  const categories=[
    ...new Set(
      radarData.datasets
      .map(x=>x.category)
      .filter(Boolean)
    )
  ];

  categories.forEach(category=>{

    const option=document.createElement("option");

    option.value=category;
    option.textContent=category;

    select.appendChild(option);

  });

}


function renderDatasets(){

  const keyword=
    document.getElementById("search").value
    .toLowerCase();

  const category=
    document.getElementById("category").value;

  const box=document.getElementById("datasets");

  box.innerHTML="";


  const filtered=radarData.datasets.filter(dataset=>{

    const text=(
      dataset.title+" "+
      dataset.category+" "+
      dataset.publisher
    ).toLowerCase();

    return(
      (!keyword || text.includes(keyword)) &&
      (!category || dataset.category===category)
    );

  });


  document.getElementById("status").textContent=
    filtered.length+"件の公開データを表示";


  filtered.forEach((dataset,index)=>{

    const div=document.createElement("div");

    div.className="card dataset";

    div.innerHTML=`

      <span class="badge">
        ${escapeHtml(dataset.category || "その他")}
      </span>

      <h2>
        ${escapeHtml(dataset.title)}
      </h2>

      <p class="small">
        公開元：${escapeHtml(dataset.publisher || "")}<br>
        データ時点：${escapeHtml(dataset.data_as_of || "記載なし")}<br>
        更新・公開日：${escapeHtml(dataset.published || "記載なし")}
      </p>

      <button onclick="showDetail(${index})">
        詳細を見る
      </button>

    `;

    box.appendChild(div);

  });

}


function showDetail(index){

  const dataset=radarData.datasets[index];

  document.getElementById("listPage").style.display="none";
  document.getElementById("detailPage").style.display="block";


  let html=`

    <span class="badge">
      ${escapeHtml(dataset.category || "その他")}
    </span>

    <h1>
      ${escapeHtml(dataset.title)}
    </h1>

    <p>
      <b>公開元：</b>
      ${escapeHtml(dataset.publisher || "")}
    </p>

    <p>
      <b>データ時点：</b>
      ${escapeHtml(dataset.data_as_of || "記載なし")}
    </p>

    <p>
      <b>公開・更新日：</b>
      ${escapeHtml(dataset.published || "記載なし")}
    </p>

    <div class="source">

      <h3>公式情報</h3>

      <p class="small">
        詳細な内容・元データについては、
        公開元の公式ページをご確認ください。
      </p>

      <a
        class="button"
        href="${dataset.source_url}"
        target="_blank"
        rel="noopener"
      >
        公式ページを開く
      </a>

    </div>

    <div class="source">

      <h3>利用条件</h3>

      <p class="small">
        ${escapeHtml(dataset.license || "公開元の利用条件をご確認ください。")}
      </p>

    </div>

    <div class="source">

      <h3>OPEN RADARの表示について</h3>

      <p class="small">
        このページは公開元の情報を整理して表示しています。
        内容の正確性・最新性については必ず公式情報をご確認ください。
      </p>

    </div>

  `;


  document.getElementById("detailContent").innerHTML=html;

}


function showList(){

  document.getElementById("detailPage").style.display="none";
  document.getElementById("listPage").style.display="block";

}


function escapeHtml(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


document
.getElementById("search")
.addEventListener("input",renderDatasets);

document
.getElementById("category")
.addEventListener("change",renderDatasets);


loadData();

</script>

</body>
</html>
